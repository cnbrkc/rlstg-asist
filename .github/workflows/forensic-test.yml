name: Telegram Forensic Test

on:
  workflow_dispatch:

jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q google-genai opencv-python-headless imageio-ffmpeg

      - name: Download latest Telegram video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" > updates.json
          python - <<'PY'
          import json, os, sys, urllib.request
          data=json.load(open('updates.json',encoding='utf-8'))
          found=None
          for update in reversed(data.get('result',[])):
              msg=update.get('message') or update.get('edited_message') or {}
              if msg.get('video'):
                  found=(msg['chat']['id'], msg['video']['file_id'], msg['video'].get('file_name','telegram_video.mp4'))
                  break
          if not found:
              raise SystemExit('Telegram güncellemelerinde video bulunamadı. Yeni bir video gönderip workflowu tekrar çalıştır.')
          chat_id,file_id,file_name=found
          token=os.environ['TELEGRAM_BOT_TOKEN']
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getFile?file_id={file_id}') as r:
              file_path=json.load(r)['result']['file_path']
          with urllib.request.urlopen(f'https://api.telegram.org/file/bot{token}/{file_path}') as r:
              video=r.read()
          open('input_video.mp4','wb').write(video)
          open('chat_id.txt','w').write(str(chat_id))
          print(f'Video indirildi: {file_name} / {len(video)/1024/1024:.2f} MB')
          PY

      - name: Run forensic video analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google import genai
          from google.genai import types

          video=open('input_video.mp4','rb').read()
          client=genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          schema={
            'type':'object',
            'properties':{
              'brand':{'type':'string'},
              'model':{'type':'string'},
              'confidence':{'type':'number'},
              'observed_facts':{'type':'array','items':{'type':'string'}},
              'unknowns':{'type':'array','items':{'type':'string'}}
            },
            'required':['brand','model','confidence','observed_facts','unknowns']
          }
          config=types.GenerateContentConfig(
            system_instruction='Analyze this automotive video visually. Only state what can be observed. Do not invent facts. Return JSON.',
            response_mime_type='application/json',
            response_schema=schema,
          )
          part=types.Part.from_bytes(data=video,mime_type='video/mp4')
          response=client.models.generate_content(model='gemini-3.5-flash',contents=[part],config=config)
          result=getattr(response,'text','')
          print(result)
          open('result.txt','w',encoding='utf-8').write(result)
          PY

      - name: Send result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          CHAT_ID="$(cat chat_id.txt)"
          RESULT="$(cat result.txt)"
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['TELEGRAM_BOT_TOKEN']
          chat_id=open('chat_id.txt').read().strip()
          result=open('result.txt',encoding='utf-8').read()
          text='🧠 FORENSIC TEST BAŞARILI\n\n'+result
          if len(text)>3900: text=text[:3900]+'\n…'
          body=json.dumps({'chat_id':chat_id,'text':text}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage',data=body,headers={'Content-Type':'application/json'})
          urllib.request.urlopen(req).read()
          PY
