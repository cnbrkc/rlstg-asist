name: Fix research tool JSON compatibility
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "${{ github.event.head_commit.message != 'fix: allow research tools with JSON text output' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded router fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('router.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    def metin_uret(')
          end=s.index('    def video_analiz_et(', start)
          block=s[start:end]
          old='''        kwargs=dict(system_instruction=system_prompt,response_mime_type="application/json",response_schema=response_schema)\n        if arama_kullan and model_listesi and model_arama_destekliyor_mu(model_listesi[0]): kwargs["tools"]=[types.Tool(google_search=types.GoogleSearch())]'''
          new='''        if arama_kullan:\n            # Gemini rejects response_mime_type=application/json when Google Search\n            # tool use is enabled. Research prompts already require JSON, so let\n            # the model return JSON text and parse it with guvenli_json_yukle.\n            kwargs=dict(system_instruction=system_prompt)\n            if model_listesi and model_arama_destekliyor_mu(model_listesi[0]):\n                kwargs["tools"]=[types.Tool(google_search=types.GoogleSearch())]\n        else:\n            kwargs=dict(system_instruction=system_prompt,response_mime_type="application/json",response_schema=response_schema)'''
          assert block.count(old)==1, f'expected 1 exact research block, got {block.count(old)}'
          s=s[:start]+block.replace(old,new)+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile router.py
          git diff --check
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix_research_tool_json.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add router.py .github/workflows/fix_research_tool_json.yml
          git diff --cached --check
          git commit -m "fix: allow research tools with JSON text output"
          git push origin main
