name: repair-visible-regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-visible-regressions.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact guarded fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for name, old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: guard failed for {name}: expected 1, found {count}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
              print(f'{path}: changed={text != original}')

          patch('router.py', [
              ('quota retry disabled', 'RETRY_QUOTA_MAX = 1', 'RETRY_QUOTA_MAX = 0'),
              ('remove full-request quota replay', '''        try:\n            response,info=self._make_request(model_listesi,icerik,types.GenerateContentConfig(**kwargs),log_ekle,stop_on_quota=False)\n        except Exception:\n            if arama_kullan and self._last_request_had_quota:\n                self._clear_cooldowns(model_listesi); kwargs.pop("tools",None)\n                response,info=self._make_request(model_listesi,icerik,types.GenerateContentConfig(**kwargs),log_ekle)\n            else: raise\n''', '''        response,info=self._make_request(\n            model_listesi,\n            icerik,\n            types.GenerateContentConfig(**kwargs),\n            log_ekle,\n            stop_on_quota=False,\n        )\n'''),
          ])

          patch('media.py', [
              ('remove video speed sync block', '''    video_sure=video_suresini_al(video_yolu); ses_sure=_ses_suresini_al(ses_yolu); video_filtresi=None\n    if video_sure>0 and ses_sure>0:\n        oran=video_sure/ses_sure\n        if abs(oran-1.0)>=0.02:\n            uygulanan_oran=max(MIN_VIDEO_YAVASLATMA,min(MAKS_VIDEO_HIZLANDIRMA,oran))\n            if abs(uygulanan_oran-1.0)>=0.005:\n                video_filtresi=f"setpts=PTS/{uygulanan_oran:.6f}"\n                log_ekle(f"🎚️ Ses/video süre uyumu: video {video_sure:.2f}s → ses {ses_sure:.2f}s | görüntü hızı {uygulanan_oran:.2f}x")\n            if abs(oran-uygulanan_oran)>0.01: log_ekle(f"⚠️ Süre farkı {oran:.2f}x sınırın dışında; güvenli {uygulanan_oran:.2f}x sınırı kullanıldı.")\n        else: log_ekle(f"🎚️ Ses/video süre uyumu: fark küçük ({abs(video_sure-ses_sure):.2f}s), hız değişimi yapılmadı.")\n''', '''    video_sure=video_suresini_al(video_yolu); ses_sure=_ses_suresini_al(ses_yolu); video_filtresi=None\n    if video_sure>0 and ses_sure>0:\n        fark=abs(video_sure-ses_sure)\n        log_ekle(f"🎚️ Ses/video süre uyumu: video {video_sure:.2f}s → ses {ses_sure:.2f}s | video hızı değiştirilmeden ses senkronlanacak.")\n        if fark >= 0.02:\n            if ses_sure < video_sure:\n                log_ekle(f"🎚️ TTS video süresinden {fark:.2f}s kısa; eksik süre sessizlikle doldurulacak.")\n            else:\n                log_ekle(f"🎚️ TTS video süresinden {fark:.2f}s uzun; final ses video süresinde kesilecek.")\n'''),
              ('pad audio and keep full video', '"-c:a","aac","-ar",str(FINAL_AUDIO_SAMPLE_RATE),"-ac",str(SES_KANAL),"-b:a",FINAL_AUDIO_BITRATE,"-shortest",cikti_yolu]', '"-af","apad","-c:a","aac","-ar",str(FINAL_AUDIO_SAMPLE_RATE),"-ac",str(SES_KANAL),"-b:a",FINAL_AUDIO_BITRATE] + (["-t",f"{video_sure:.6f}"] if video_sure > 0 else []) + [cikti_yolu]'),
          ])

          patch('telegram_pipeline_worker.py', [
              ('insert deterministic social fallback helpers', '''def _caption_with_hashtags(description, hashtags):\n''', '''def _first_verified_fact_for_social(result):\n    facts = result.get("fact_lock") if isinstance(result, dict) else {}\n    facts = facts.get("facts") if isinstance(facts, dict) else []\n    if isinstance(facts, list):\n        for item in facts:\n            if isinstance(item, dict) and str(item.get("status") or "").upper() in {"OBSERVED", "VERIFIED"}:\n                fact = str(item.get("fact") or "").strip()\n                if fact:\n                    return fact\n    return ""\n\n\ndef _social_fallbacks(result):\n    result = result if isinstance(result, dict) else {}\n    editorial = result.get("editorial_brief") if isinstance(result.get("editorial_brief"), dict) else {}\n    identity = result.get("fact_lock") if isinstance(result.get("fact_lock"), dict) else {}\n    fact = _first_verified_fact_for_social(result)\n    core = str(editorial.get("core_story") or "").strip()\n    discussion = str(editorial.get("discussion_territory") or "").strip()\n    video_state = result.get("pipeline_state", {}).get("video_state", {}) if isinstance(result.get("pipeline_state"), dict) else {}\n    video_identity = video_state.get("video_identity", {}) if isinstance(video_state, dict) else {}\n    model = str(video_identity.get("exact_model") or video_identity.get("brand") or "bu araç").strip()\n    if not model or model.upper() == "UNKNOWN":\n        model = "bu araç"\n    caption = "\\n\\n".join(x for x in [\n        f"{model}: videonun ötesinde asıl merak edilen taraf burada başlıyor.",\n        core or fact or "Videodaki detayları Fact Lock sınırları içinde değerlendiriyoruz.",\n        fact,\n        "Rakamlar kadar gerçek kullanımın ne söylediği de önemli.",\n    ] if x)[:900].rstrip()\n    threads = discussion or core or fact or f"{model} tarafında asıl tartışma, görünen detayın gerçek kullanımda ne ifade ettiği."\n    threads = threads[:480].rstrip()\n    hashtags = ["otoxtra", "otomobil", "araba", "otomobilhaber", "arabasever"]\n    return caption, hashtags, threads\n\n\ndef _caption_with_hashtags(description, hashtags):\n'''),
              ('enforce social output invariant', '''    caption = result.get("reels_aciklamasi") or ""\n    hashtags = result.get("reels_hashtagleri") or []\n    if not caption.strip():\n        warnings.append("⚠️ Instagram/Facebook açıklaması boş üretildi.")\n    if not hashtags:\n        warnings.append("⚠️ Hashtag listesi boş üretildi.")\n''', '''    caption = str(result.get("reels_aciklamasi") or "").strip()\n    hashtags = result.get("reels_hashtagleri") or []\n    if not caption.strip() or not hashtags:\n        fallback_caption, fallback_hashtags, fallback_threads = _social_fallbacks(result)\n        if not caption.strip():\n            caption = fallback_caption\n            result["reels_aciklamasi"] = caption\n            warnings.append("⚠️ Caption modeli boş döndü; Fact Lock tabanlı güvenli sosyal fallback kullanıldı.")\n        if not hashtags:\n            hashtags = fallback_hashtags\n            result["reels_hashtagleri"] = hashtags\n            warnings.append("⚠️ Hashtag modeli boş döndü; güvenli varsayılan hashtag seti kullanıldı.")\n    threads = str(result.get("threads_aciklamasi") or "").strip()\n    if not threads:\n        _, _, fallback_threads = _social_fallbacks(result)\n        threads = fallback_threads\n        result["threads_aciklamasi"] = threads\n        warnings.append("⚠️ Threads modeli boş döndü; Fact Lock tabanlı güvenli fallback kullanıldı.")\n'''),
              ('use final threads variable', '''    threads = result.get("threads_aciklamasi") or ""\n    send_message(threads if threads else "Açıklama üretilemedi.")\n''', '''    send_message(threads)\n'''),
          ])

          # The social fallback block above is only for the video pipeline.
          # Keep text-only behavior intact, but guarantee its Threads output too.
          patch('telegram_pipeline_worker.py', [
              ('text pipeline threads invariant', '''    threads = result.get("threads_aciklamasi") or ""\n    social_bundle = "📝 INSTAGRAM AÇIKLAMASI + HASHTAGLER\\n\\n" + f"{social_caption}\\n\\n" + f"{threads if threads else 'Açıklama üretilemedi.'}"\n''', '''    threads = str(result.get("threads_aciklamasi") or "").strip()\n    if not threads:\n        _, _, fallback_threads = _social_fallbacks(result)\n        threads = fallback_threads\n        warnings.append("⚠️ Threads modeli boş döndü; Fact Lock tabanlı güvenli fallback kullanıldı.")\n    social_bundle = "📝 INSTAGRAM AÇIKLAMASI + HASHTAGLER\\n\\n" + f"{social_caption}\\n\\n" + threads\n'''),
          ])
          PY

          python -m py_compile router.py media.py telegram_pipeline_worker.py pipeline.py telegram_pipeline_guard.py
          git diff --check
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-visible-regressions.yml
          git add router.py media.py telegram_pipeline_worker.py .github/workflows/repair-visible-regressions.yml
          git commit -m "fix: preserve social outputs and video duration" || exit 0
          git push origin HEAD:main
