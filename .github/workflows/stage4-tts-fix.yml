name: Stage 4 TTS render gate patch

on:
  push:
    paths:
      - '.github/workflows/stage4-tts-fix.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pipeline syntax
        run: |
          python -m py_compile pipeline.py
          echo 'PIPELINE_COMPILE_OK'
