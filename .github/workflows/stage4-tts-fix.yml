name: Stage 4 TTS render gate patch

on:
  push:
    paths:
      - '.github/workflows/stage4-tts-fix.yml'
      - '.github/scripts/stage4_tts_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact guarded patch
        run: python .github/scripts/stage4_tts_patch.py
      - name: Commit patch and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py
          git commit -m 'fix: preserve valid TTS WAV for render'
          git rm .github/scripts/stage4_tts_patch.py .github/workflows/stage4-tts-fix.yml
          git commit -m 'chore: remove temporary Stage 4 patcher'
          git push
