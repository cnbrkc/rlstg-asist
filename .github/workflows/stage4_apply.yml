name: Stage 4 apply
on:
  push:
    paths:
      - '.github/workflows/stage4_apply.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo 'CmZyb20gcGF0aGxpYiBpbXBvcnQgUGF0aA==' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_pipeline_worker.py
          git diff --cached --check
          git commit -m 'fix: correct Telegram progress state and QA label'
          git push origin main
