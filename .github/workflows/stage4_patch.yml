name: Stage 4 patch
on:
  push:
    paths:
      - '.github/workflows/stage4_patch.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Stage 4 fixes
        shell: python
        run: |
          from pathlib import Path
          import py_compile
          worker = Path('telegram_pipeline_worker.py')
          text = worker.read_text(encoding='utf-8')
          old_video = '''    def progress(n, total, msg):
        step_status[n - 1] = "🟢"
        current = PIPELINE_STEPS[n - 1] if 0 < n <= len(PIPELINE_STEPS) else str(msg)
        try:
            edit_message(loading_id, _loading_text(n - 1, f"Tamamlandı → {current}", len(warnings), len(errors)))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
'''
          new_video = '''    def progress(n, total, msg):
        # n mevcut aşamadır; n-1 aşaması tamamlanmıştır.
        if 0 < n <= len(PIPELINE_STEPS):
            if n > 1:
                step_status[n - 2] = "🟢"
            step_status[n - 1] = "🔄"
            current = PIPELINE_STEPS[n - 1]
            done = n - 1
        else:
            current = str(msg)
            done = min(max(n - 1, 0), len(PIPELINE_STEPS))
        try:
            edit_message(loading_id, _loading_text(done, f"Çalışıyor → {current}", len(warnings), len(errors)))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
'''
          old_text = '''    def progress(n, total, msg):
        step_status[n - 1] = "🟢"
        current = TEXT_PIPELINE_STEPS[n - 1] if 0 < n <= len(TEXT_PIPELINE_STEPS) else str(msg)
        try:
            edit_message(loading_id, _loading_text(n - 1, f"Tamamlandı → {current}", len(warnings), len(errors), steps=TEXT_PIPELINE_STEPS))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
'''
          new_text = '''    def progress(n, total, msg):
        # n mevcut aşamadır; n-1 aşaması tamamlanmıştır.
        if 0 < n <= len(TEXT_PIPELINE_STEPS):
            if n > 1:
                step_status[n - 2] = "🟢"
            step_status[n - 1] = "🔄"
            current = TEXT_PIPELINE_STEPS[n - 1]
            done = n - 1
        else:
            current = str(msg)
            done = min(max(n - 1, 0), len(TEXT_PIPELINE_STEPS))
        try:
            edit_message(loading_id, _loading_text(done, f"Çalışıyor → {current}", len(warnings), len(errors), steps=TEXT_PIPELINE_STEPS))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
'''
          if old_video not in text or old_text not in text:
              raise SystemExit('progress block mismatch; refusing to modify')
          text = text.replace(old_video, new_video, 1).replace(old_text, new_text, 1)
          text = text.replace("QA regeneration: {result.get('qa_regeneration_rounds', 0)} / 2", "QA regeneration: {result.get('qa_regeneration_rounds', 0)} / 1")
          worker.write_text(text, encoding='utf-8')
          py_compile.compile('telegram_pipeline_worker.py', doraise=True)
          py_compile.compile('pipeline.py', doraise=True)
          pipeline = Path('pipeline.py').read_text(encoding='utf-8')
          marker = "state['reels_state']=reels_state; state['duo_plan']=duo_plan; state['duo_script']=duo_script; state['ses_modu']=ses_modu; state['qa_regeneration_rounds']=qa_rounds; state['qa_pass']=qa_pass\n"
          if marker not in pipeline:
              raise SystemExit('pipeline state marker mismatch; refusing to modify')
          if "state['ses_dosyasi_son']=ses_dosyasi if ses_basarili" not in pipeline:
              pipeline = pipeline.replace(marker, marker + "    state['ses_dosyasi_son']=ses_dosyasi if ses_basarili and ses_dosyasi and os.path.exists(ses_dosyasi) else ''\n", 1)
              Path('pipeline.py').write_text(pipeline, encoding='utf-8')
              py_compile.compile('pipeline.py', doraise=True)
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_pipeline_worker.py pipeline.py
          git rm .github/workflows/stage4_patch.yml
          git diff --cached --check
          git commit -m "fix: stabilize pipeline state and Telegram progress"
          git push origin main
