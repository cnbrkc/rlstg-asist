name: Stage 4 cleanup patch
on:
  push:
    paths:
      - '.github/workflows/stage4_cleanup_patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact safe patch
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import py_compile

          p = Path('telegram_pipeline_worker.py')
          s = p.read_text(encoding='utf-8')

          old_video = '''    def progress(n, total, msg):
        step_status[n - 1] = "🟢"
        current = PIPELINE_STEPS[n - 1] if 0 < n <= len(PIPELINE_STEPS) else str(msg)
        try:
            edit_message(loading_id, _loading_text(n - 1, f"Tamamlandı → {current}", len(warnings), len(errors)))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
'''
          new_video = '''    def progress(n, total, msg):
        if 0 < n <= len(PIPELINE_STEPS):
            if n > 1:
                step_status[n - 2] = "🟢"
            step_status[n - 1] = "🔄"
            current = PIPELINE_STEPS[n - 1]
            done = n - 1
        else:
            current = str(msg)
            done = min(max(n - 1, 0), len(PIPELINE_STEPS))
        try:
            edit_message(loading_id, _loading_text(done, f"Çalışıyor → {current}", len(warnings), len(errors)))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
'''

          old_text = '''    def progress(n, total, msg):
        step_status[n - 1] = "🟢"
        current = TEXT_PIPELINE_STEPS[n - 1] if 0 < n <= len(TEXT_PIPELINE_STEPS) else str(msg)
        try:
            edit_message(loading_id, _loading_text(n - 1, f"Tamamlandı → {current}", len(warnings), len(errors), steps=TEXT_PIPELINE_STEPS))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
'''
          new_text = '''    def progress(n, total, msg):
        if 0 < n <= len(TEXT_PIPELINE_STEPS):
            if n > 1:
                step_status[n - 2] = "🟢"
            step_status[n - 1] = "🔄"
            current = TEXT_PIPELINE_STEPS[n - 1]
            done = n - 1
        else:
            current = str(msg)
            done = min(max(n - 1, 0), len(TEXT_PIPELINE_STEPS))
        try:
            edit_message(loading_id, _loading_text(done, f"Çalışıyor → {current}", len(warnings), len(errors), steps=TEXT_PIPELINE_STEPS))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
'''

          if s.count(old_video) != 1:
              raise SystemExit('ABORT: exact video progress block count is not 1')
          if s.count(old_text) != 1:
              raise SystemExit('ABORT: exact text progress block count is not 1')
          if s.count("QA regeneration: {result.get('qa_regeneration_rounds', 0)} / 2") != 1:
              raise SystemExit('ABORT: QA label count is not 1')

          s = s.replace(old_video, new_video, 1)
          s = s.replace(old_text, new_text, 1)
          s = s.replace("QA regeneration: {result.get('qa_regeneration_rounds', 0)} / 2", "QA regeneration: {result.get('qa_regeneration_rounds', 0)} / 1", 1)

          p.write_text(s, encoding='utf-8')
          py_compile.compile('telegram_pipeline_worker.py', doraise=True)
          py_compile.compile('pipeline.py', doraise=True)
          PY
          python /tmp/patch.py
      - name: Commit worker and remove temporary patch workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_pipeline_worker.py
          git rm -f .github/workflows/stage4_patch2.yml .github/workflows/stage4_safe_patch.yml .github/workflows/stage4_safe_patch2.yml .github/workflows/stage4_final_patch.yml .github/workflows/stage4_cleanup_patch.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: correct Telegram progress state and QA label"
          git push origin main
