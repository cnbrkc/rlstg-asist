name: Stage 4 progress patch

on:
  push:
    paths:
      - '.github/workflows/stage4-progress-patch.yml'
      - '.github/scripts/stage4_progress_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact guarded patch
        run: python .github/scripts/stage4_progress_patch.py
      - name: Verify syntax
        run: python -m py_compile telegram_pipeline_worker.py
      - name: Commit worker and remove temporary patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_pipeline_worker.py
          git commit -m 'fix: correct Telegram pipeline progress stages'
          git rm .github/scripts/stage4_progress_patch.py .github/workflows/stage4-progress-patch.yml
          git commit -m 'chore: remove temporary progress patcher'
          git push
