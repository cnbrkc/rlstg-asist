name: Telegram Video Intake

on:
  workflow_dispatch:
    inputs:
      telegram_file_id:
        description: Telegram file_id (video mode)
        required: false
        default: ""
        type: string
      telegram_text:
        description: Telegram text input (text-only mode)
        required: false
        default: ""
        type: string
      telegram_chat_id:
        description: Telegram chat_id
        required: true
        type: string
      telegram_filename:
        description: Video filename
        required: false
        default: telegram_video.mp4
        type: string
      telegram_update_id:
        description: Telegram update_id
        required: false
        default: ""
        type: string
      video_note:
        description: Optional Telegram video caption/note
        required: false
        default: ""
        type: string
      content_tone:
        description: Selected content tone
        required: true
        default: dengeli
        type: choice
        options:
          - eglence
          - dengeli
          - bilgi
          - teknik

permissions:
  contents: write

concurrency:
  group: telegram-video-intake
  cancel-in-progress: false

jobs:
  telegram-video:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input mode
        env:
          TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          TELEGRAM_TEXT: ${{ inputs.telegram_text }}
        run: |
          set -euo pipefail
          has_video=0
          has_text=0
          [ -n "$TELEGRAM_FILE_ID" ] && has_video=1
          [ -n "$TELEGRAM_TEXT" ] && has_text=1
          if [ "$has_video" -eq 1 ] && [ "$has_text" -eq 1 ]; then
            echo "Video and text inputs cannot be used together."
            exit 1
          fi
          if [ "$has_video" -eq 0 ] && [ "$has_text" -eq 0 ]; then
            echo "Either telegram_file_id or telegram_text is required."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Telegram video
        if: ${{ inputs.telegram_file_id != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          TELEGRAM_FILENAME: ${{ inputs.telegram_filename }}
        run: python -m telegram.telegram_webhook_intake

      - name: Save video to repository
        if: ${{ inputs.telegram_file_id != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Process Telegram video input"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              echo "Remote main changed; rebasing before retry ($attempt/3)..."
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Setup FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Run Reels pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          VIDEO_FILES: ${{ inputs.telegram_file_id != '' && format('data/{0}', inputs.telegram_filename) || '' }}
          TEXT_INPUT: ${{ inputs.telegram_text }}
          VIDEO_ANALYSIS_NOTE: ${{ inputs.video_note }}
          CONTENT_TONE: ${{ inputs.content_tone }}
        run: python -m telegram.telegram_pipeline_runner
