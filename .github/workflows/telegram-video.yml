name: Telegram Video Intake

on:
  workflow_dispatch:
    inputs:
      telegram_file_id:
        description: Telegram file_id
        required: true
        type: string
      telegram_chat_id:
        description: Telegram chat_id
        required: true
        type: string
      telegram_filename:
        description: Video filename
        required: false
        default: telegram_video.mp4
        type: string
      telegram_update_id:
        description: Telegram update_id
        required: false
        default: ""
        type: string
      content_tone:
        description: Selected content tone
        required: true
        default: dengeli
        type: choice
        options:
          - eglence
          - dengeli
          - bilgi
          - teknik

permissions:
  contents: write

jobs:
  telegram-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Telegram video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          TELEGRAM_FILENAME: ${{ inputs.telegram_filename }}
        run: python telegram_webhook_intake.py

      - name: Save video to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Process Telegram video input"
            git push
          fi

      - name: Setup FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Run Reels pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          VIDEO_FILES: data/${{ inputs.telegram_filename }}
          CONTENT_TONE: ${{ inputs.content_tone }}
        run: python telegram_pipeline_worker.py
