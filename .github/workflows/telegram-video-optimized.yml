name: Telegram Video Intake Optimized

on:
  workflow_dispatch:
    inputs:
      telegram_file_id:
        description: Telegram file_id (video mode)
        required: false
        default: ""
        type: string
      telegram_text:
        description: Telegram text input (text-only mode)
        required: false
        default: ""
        type: string
      telegram_chat_id:
        description: Telegram chat_id
        required: true
        type: string
      telegram_filename:
        description: Video filename
        required: false
        default: telegram_video.mp4
        type: string
      telegram_update_id:
        description: Telegram update_id
        required: false
        default: ""
        type: string
      video_note:
        description: Telegram video caption / user analysis note
        required: false
        default: ""
        type: string
      content_tone:
        description: Selected content tone
        required: true
        default: dengeli
        type: choice
        options:
          - eglence
          - dengeli
          - bilgi
          - teknik

permissions:
  contents: read

concurrency:
  group: telegram-video-${{ inputs.telegram_chat_id }}
  # Aynı sohbette ikinci istek gelirse devam eden render'ı KESME: kuyruğa gir.
  # cancel-in-progress: true, uzun bir render'ı ortadan kesip kullanıcıya
  # haber vermeden videoyu çöpe atıyordu.
  cancel-in-progress: false

jobs:
  telegram-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate input mode
        env:
          TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          TELEGRAM_TEXT: ${{ inputs.telegram_text }}
        run: |
          set -euo pipefail
          has_video=0
          has_text=0
          [ -n "$TELEGRAM_FILE_ID" ] && has_video=1
          [ -n "$TELEGRAM_TEXT" ] && has_text=1
          if [ "$has_video" -eq 1 ] && [ "$has_text" -eq 1 ]; then
            echo "Video and text inputs cannot be used together."
            exit 1
          fi
          if [ "$has_video" -eq 0 ] && [ "$has_text" -eq 0 ]; then
            echo "Either telegram_file_id or telegram_text is required."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/
            cloudflare/
            data/pending/
            core/
            telegram/
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Download Telegram video
        if: ${{ inputs.telegram_file_id != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          TELEGRAM_FILENAME: ${{ inputs.telegram_filename }}
        run: python -m telegram.telegram_webhook_intake

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Verify ffmpeg binary from imageio-ffmpeg
        run: |
          python - << 'PY'
          import imageio_ffmpeg
          p = imageio_ffmpeg.get_ffmpeg_exe()
          print("imageio ffmpeg:", p)
          PY

      - name: Compile check
        run: python -m compileall -q core telegram

      - name: Run Reels pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_UPDATE_ID: ${{ inputs.telegram_update_id }}
          TEXT_INPUT: ${{ inputs.telegram_text }}
          VIDEO_ANALYSIS_NOTE: ${{ inputs.video_note }}
          CONTENT_TONE: ${{ inputs.content_tone }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "::group::Reels pipeline ayrıntılı zamanlama"
          /usr/bin/time -v python -m telegram.telegram_pipeline_worker
          echo "::endgroup::"

      # Pipeline adımı düşerse kullanıcı Telegram'dan haber bekler; sessiz
      # FAIL_NO_VIDEO dönemi (#23): job kırmızıya döner ama sohbete kimse
      # yazmaz, buton "yükleniyor"da kalır. Bu adım her zaman koşar ve yalnız
      # failure durumunda mesaj gönderir; bildirimin kendisi job'u kırmaz.
      - name: Notify user on failure
        if: ${{ always() && failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat:
              print("Bildirim atlanıyor: TELEGRAM_BOT_TOKEN / chat_id yok.")
              raise SystemExit(0)
          mesaj = (
              "❌ Reels pipeline bu çalışmada sonuç üretemedi.\n\n"
              "Yeni bir video veya metin göndererek tekrar deneyebilirsin.\n"
              "Ayrıntı: job logundaki 'Publish diagnostic summary' adımı ve "
              "pipeline-result artifact'ı."
          )
          data = json.dumps({"chat_id": chat, "text": mesaj}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"content-type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print("Bildirim gönderildi:", response.status)
          except Exception as exc:
              # Bildirim hatası job'un kendi sonucunu değiştirmemeli.
              print(f"Bildirim gönderilemedi: {type(exc).__name__}")
          PY

      - name: Publish diagnostic summary
        if: ${{ always() }}
        env:
          TELEGRAM_UPDATE_ID: ${{ inputs.telegram_update_id }}
        run: |
          {
            echo "## Reels pipeline diagnostics"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Attempt: $GITHUB_RUN_ATTEMPT"
            echo "- Telegram update ID: ${TELEGRAM_UPDATE_ID:-not provided}"
            echo "- Result JSON exists: $([ -f pipeline_result.json ] && echo yes || echo no)"
            if [ -f pipeline_result.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          p = Path("pipeline_result.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print(f"- Result size: {p.stat().st_size} bytes")
          print(f"- Run status: {data.get('run_status', 'unknown')}")
          print(f"- QA pass: {data.get('qa_pass')}")
          print(f"- QA regeneration rounds: {data.get('qa_regeneration_rounds', 0)}")
          print(f"- Voice mode: {data.get('voice_mode', 'unknown')}")
          print(f"- Warnings: {len(data.get('warnings') or [])}")
          print(f"- Errors: {len(data.get('errors') or [])}")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Includes generated copy and the user-provided analysis note; keep access
      # to repository collaborators and retention short for privacy.
      - name: Upload pipeline diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: pipeline_result.json
          if-no-files-found: ignore
          retention-days: 7
