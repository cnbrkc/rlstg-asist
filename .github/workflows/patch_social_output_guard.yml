name: patch-social-output-guard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: social output length and diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch social output guards
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pipeline.py')
          s = p.read_text(encoding='utf-8')
          old = '''    threads_state = _threads_state_normalize(threads_state)\n    if not str(threads_state.get("threads_aciklamasi") or "").strip():\n        log("⚠️ Threads boş döndü; yalnızca bir kez kontrollü Threads regeneration yapılacak.")'''
          new = '''    threads_state = _threads_state_normalize(threads_state)\n    threads_text = str(threads_state.get("threads_aciklamasi") or "").strip()\n    if threads_text and len(threads_text) < 280:\n        log(f"⚠️ Threads çok kısa üretildi ({len(threads_text)} karakter); aynı girdilerle yalnızca bir kontrollü Threads regeneration yapılacak.")\n        try:\n            regenerated_threads, regenerated_model = _threads_calistir(router,video_state,fact_state,editorial_state,log)\n            regenerated_threads = _threads_state_normalize(regenerated_threads)\n            regenerated_text = str(regenerated_threads.get("threads_aciklamasi") or "").strip()\n            if len(regenerated_text) >= len(threads_text):\n                threads_state, model_threads = regenerated_threads, regenerated_model\n                threads_text = regenerated_text\n                log(f"✅ Threads regeneration sonucu: {len(threads_text)} karakter")\n            else:\n                log(f"⚠️ Threads regeneration daha kısa çıktı ({len(regenerated_text)} karakter); mevcut çıktı korunuyor.")\n        except Exception as e:\n            log(f"⚠️ Threads kısa çıktı regeneration başarısız: {str(e)[:150]}")\n    if not threads_text:\n        log("⚠️ Threads boş döndü; yalnızca bir kez kontrollü Threads regeneration yapılacak.")'''
          if old not in s:
              raise SystemExit('pipeline exact patch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('telegram_pipeline_worker.py')
          s = p.read_text(encoding='utf-8')
          old = '''    threads = str(result.get("threads_aciklamasi") or "").strip()\n    if not threads:\n        _, _, fallback_threads = _social_fallbacks(result)'''
          new = '''    threads = str(result.get("threads_aciklamasi") or "").strip()\n    print(f"📤 SOSYAL ÇIKTI TEŞHİSİ: caption={len(caption)} karakter | hashtag={len(hashtags)} adet | threads={len(threads)} karakter", flush=True)\n    if not threads:\n        _, _, fallback_threads = _social_fallbacks(result)'''
          if old not in s:
              raise SystemExit('worker exact patch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python -m py_compile pipeline.py telegram_pipeline_worker.py
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline.py telegram_pipeline_worker.py .github/workflows/patch_social_output_guard.yml
          git commit -m 'fix: social output length and diagnostics'
          git push origin HEAD:main
      - name: Remove patch workflow
        if: always()
        run: |
          git fetch origin main
          git checkout main
          rm -f .github/workflows/patch_social_output_guard.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove temporary social patch workflow'
            git push origin HEAD:main
          fi

# exact guarded patch; no mainbackup writes