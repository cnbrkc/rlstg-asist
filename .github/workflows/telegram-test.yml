name: Telegram Bot Test

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Telegram bot and reply to latest /start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking Telegram bot..."
          curl --fail --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"
          echo

          echo "Reading latest Telegram updates..."
          UPDATES="$(curl --fail --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates")"

          echo "$UPDATES" > updates.json

          CHAT_ID="$(python - <<'PY'
          import json
          with open('updates.json', encoding='utf-8') as f:
              data = json.load(f)
          results = data.get('result', [])
          chat_id = None
          for update in reversed(results):
              message = update.get('message') or update.get('edited_message')
              if message and message.get('chat', {}).get('id') is not None:
                  chat_id = message['chat']['id']
                  break
          if chat_id is not None:
              print(chat_id)
          PY
          )"

          if [ -z "$CHAT_ID" ]; then
            echo "No Telegram message found. Open the bot in Telegram and send /start, then run this workflow again."
            exit 1
          fi

          echo "Sending test message..."
          curl --fail --silent --show-error \
            -X POST \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=🤖 Reels Telegram Asistanı bağlantısı başarılı!\n\nGitHub Actions → Telegram bağlantımız çalışıyor. Bir sonraki adımda video alma sistemini kuracağız." \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          echo
