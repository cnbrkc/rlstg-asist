name: Stage 4 API patch
on:
  push:
    paths:
      - '.github/workflows/stage4_api_patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const path = 'telegram_pipeline_worker.py';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const r = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            const current = Buffer.from(r.data.content, 'base64').toString('utf8');
            const oldVideo = `    def progress(n, total, msg):
        step_status[n - 1] = "🟢"
        current = PIPELINE_STEPS[n - 1] if 0 < n <= len(PIPELINE_STEPS) else str(msg)
        try:
            edit_message(loading_id, _loading_text(n - 1, f"Tamamlandı → {current}", len(warnings), len(errors)))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
`;
            const newVideo = `    def progress(n, total, msg):
        if 0 < n <= len(PIPELINE_STEPS):
            if n > 1:
                step_status[n - 2] = "🟢"
            step_status[n - 1] = "🔄"
            current = PIPELINE_STEPS[n - 1]
            done = n - 1
        else:
            current = str(msg)
            done = min(max(n - 1, 0), len(PIPELINE_STEPS))
        try:
            edit_message(loading_id, _loading_text(done, f"Çalışıyor → {current}", len(warnings), len(errors)))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
`;
            const oldText = `    def progress(n, total, msg):
        step_status[n - 1] = "🟢"
        current = TEXT_PIPELINE_STEPS[n - 1] if 0 < n <= len(TEXT_PIPELINE_STEPS) else str(msg)
        try:
            edit_message(loading_id, _loading_text(n - 1, f"Tamamlandı → {current}", len(warnings), len(errors), steps=TEXT_PIPELINE_STEPS))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
`;
            const newText = `    def progress(n, total, msg):
        if 0 < n <= len(TEXT_PIPELINE_STEPS):
            if n > 1:
                step_status[n - 2] = "🟢"
            step_status[n - 1] = "🔄"
            current = TEXT_PIPELINE_STEPS[n - 1]
            done = n - 1
        else:
            current = str(msg)
            done = min(max(n - 1, 0), len(TEXT_PIPELINE_STEPS))
        try:
            edit_message(loading_id, _loading_text(done, f"Çalışıyor → {current}", len(warnings), len(errors), steps=TEXT_PIPELINE_STEPS))
        except Exception as exc:
            print(f"Loading mesajı güncellenemedi: {exc}", flush=True)
`;
            if ((current.match(new RegExp(oldVideo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length !== 0) || current.includes('Çalışıyor →')) core.setFailed('worker already patched or unexpected state');
            if (!current.includes(oldVideo)) core.setFailed('exact video progress block not found');
            if (!current.includes(oldText)) core.setFailed('exact text progress block not found');
            const oldLabel = "QA regeneration: {result.get('qa_regeneration_rounds', 0)} / 2";
            if ((current.match(/QA regeneration: \{result\.get\('qa_regeneration_rounds', 0\)\} \/ 2/g) || []).length !== 1) core.setFailed('QA label not found exactly once');
            let updated = current.replace(oldVideo, newVideo).replace(oldText, newText).replace(oldLabel, "QA regeneration: {result.get('qa_regeneration_rounds', 0)} / 1");
            fs.writeFileSync('/tmp/telegram_pipeline_worker.py', updated, 'utf8');
            cp.execFileSync('python3', ['-m', 'py_compile', '/tmp/telegram_pipeline_worker.py']);
            const blob = Buffer.from(updated, 'utf8').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path, message: 'fix: correct Telegram progress state and QA label', content: blob, sha: r.data.sha, branch: 'main'});
            for (const f of ['stage4_patch2.yml','stage4_safe_patch.yml','stage4_safe_patch2.yml','stage4_final_patch.yml','stage4_cleanup_patch.yml','stage4_api_patch.yml']) {
              try {
                const x = await github.rest.repos.getContent({owner, repo, path: `.github/workflows/${f}`, ref: 'main'});
                await github.rest.repos.deleteFile({owner, repo, path: `.github/workflows/${f}`, message: `chore: remove temporary Stage 4 patch runner ${f}`, sha: x.data.sha, branch: 'main'});
              } catch (e) { if (e.status !== 404) throw e; }
            }
